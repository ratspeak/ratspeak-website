<main class="maps-app" id="mapsApp" aria-label="Ratspeak Maps">
    <div class="map-canvas" id="map" aria-hidden="true"></div>
    <div class="map-fallback" id="mapFallback" hidden>Map tiles are unavailable in this browser session.</div>

    <div class="map-left-stack" role="group" aria-label="Map controls and legend">
        <aside class="map-rail" aria-label="Map filters">
            <section class="rail-controls" aria-label="Map controls">
                <label class="search-box">
                    <span hidden>Search nodes</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input class="search-input" id="nodeSearch" type="search" autocomplete="off" placeholder="Search label, service, location">
                </label>
                <div class="filter-block">
                    <span class="filter-label">Type</span>
                    <div class="segmented segmented--kind">
                        <button class="segment-btn is-active" type="button" data-kind-filter="all">All</button>
                        <button class="segment-btn" type="button" data-kind-filter="server">Server</button>
                        <button class="segment-btn" type="button" data-kind-filter="client-auto">Client (Auto)</button>
                        <button class="segment-btn" type="button" data-kind-filter="client-manual">Client (Manual)</button>
                    </div>
                </div>
                <div class="filter-block">
                    <span class="filter-label">Freshness</span>
                    <div class="segmented segmented--status">
                        <button class="segment-btn is-active" type="button" data-status-filter="all">All</button>
                        <button class="segment-btn" type="button" data-status-filter="available">Seen</button>
                        <button class="segment-btn" type="button" data-status-filter="recent">Recent</button>
                        <button class="segment-btn" type="button" data-status-filter="stale">Stale</button>
                    </div>
                </div>
            </section>
        </aside>

        <aside class="map-legend" aria-label="Legend">
            <h2 class="legend-title">Legend</h2>
            <div class="legend-grid">
                <span class="legend-item"><span class="legend-dot" style="--legend-color: #12a8ff"></span>Server</span>
                <span class="legend-item"><span class="legend-dot" style="--legend-color: #37f987"></span>Client (Auto)</span>
                <span class="legend-item"><span class="legend-dot" style="--legend-color: #ffd344"></span>Client (Manual)</span>
                <span class="legend-item"><span class="legend-dot legend-dot--selected"></span>Selected point</span>
            </div>
        </aside>
    </div>

    <section class="node-detail" id="nodeDetail" aria-live="polite" aria-label="Selected node details" hidden></section>
</main>
